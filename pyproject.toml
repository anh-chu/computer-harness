[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-harness"
version = "0.3.0"
description = "The simplest, thinnest harness to control native macOS and Windows apps with your agent. Sibling to browser-harness."
requires-python = ">=3.9"
dependencies = [
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
    "psutil>=5.9; sys_platform == 'win32'",
    "pillow>=10.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3; python_version >= '3.10'"]

[project.scripts]
computer-harness = "computer_harness.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["computer_harness*"]
