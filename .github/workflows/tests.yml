name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pytest
      - run: python -m pytest -q tests/test_common.py
        env:
          PYTHONPATH: .

  windows-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: choco install ffmpeg -y --no-progress
      - run: computer-harness --doctor
      - run: python tests/smoke_windows.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Tree walk benchmark (pre-cache engine vs current)
        run: |
          git show 41dd0bd:computer_harness/engine_win.py > computer_harness/engine_win_old.py
          Start-Process explorer.exe C:\Windows\System32
          Start-Sleep 5
          python tests/bench_walk_windows.py System32 bench.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: |
            ~/.computer-harness/
            bench.json
          include-hidden-files: true

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: computer-harness --doctor || true
      - run: python tests/smoke_macos.py
        env:
          PYTHONIOENCODING: utf-8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-macos
          path: ~/.computer-harness/
          include-hidden-files: true
